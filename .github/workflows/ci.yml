name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,lint]'
      - run: ruff check .
      - run: pytest tests/unit
